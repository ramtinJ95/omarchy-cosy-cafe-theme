# Replaces Omarchy's generated [menu] for this theme: the café's walnut board, a shade warmer than the page, under the lamp's light.
[menu]
# Cards, rows, and selected-row treatment. Alpha companions (where present)
# go from 0 (invisible) to 1 (opaque). scrim is the full-screen dim layer
# behind the card. Clipboard and emojis inherit these tokens.
background                = "#231a15"
background-alpha          = 1.0
text                      = "#e9dcc3"
border                    = "hyprland.active-border"
border-alpha              = 1.0
scrim                     = "#0d0907"
scrim-alpha               = 0.6
selected-background       = "#f0b565"
selected-background-alpha = 0.14
selected-text             = "#f5c97d"
selected-border           = "#f0b565"
selected-border-alpha     = 0.45
